<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet & Inventory Pro</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 12px; color: #2d3748; }
    .container { max-width: 620px; margin: auto; background: #ffffff; border-radius: 14px; padding: 18px; box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2); }
    
    /* Header Tabs */
    .tab-header { display: flex; margin-bottom: 16px; border-radius: 10px; overflow: hidden; border: 2px solid #2b6cb0; background: #ebf8ff; }
    .tab-btn { flex: 1; padding: 11px 4px; text-align: center; border: none; background: transparent; color: #2b6cb0; font-weight: 700; font-size: 11px; cursor: pointer; transition: 0.2s all; }
    .tab-btn.active { background: #2b6cb0; color: #ffffff; }

    /* Form Styles */
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 12px; color: #4a5568; }
    input, select { width: 100%; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 7px; font-size: 13.5px; background: #fff; transition: border-color 0.2s; }
    input:focus, select:focus { outline: none; border-color: #3182ce; box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15); }

    .barcode-row { display: flex; gap: 8px; }
    .btn-scan { background: #319795; color: white; border: none; padding: 0 16px; border-radius: 7px; font-weight: bold; cursor: pointer; }

    /* Live Available Stock Badge */
    .stock-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: bold; margin-left: 6px; }
    .stock-in-hand { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
    .stock-low { background: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }

    #reader-container { display: none; margin-bottom: 12px; border: 2px solid #319795; border-radius: 8px; padding: 6px; background: #000; text-align: center; }
    #reader { width: 100%; }
    .btn-close-scan { margin-top: 6px; background: #e53e3e; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    .btn-submit { width: 100%; padding: 13px; background: #38a169; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.2s all; }
    .btn-submit:disabled { background: #a0aec0; cursor: not-allowed; opacity: 0.8; }
    .hidden { display: none !important; }
    #msg { margin-top: 10px; text-align: center; font-weight: 700; font-size: 13px; }

    /* KPI Summary Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .kpi-card { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 8px; text-align: center; }
    .kpi-title { font-size: 10px; font-weight: 700; color: #718096; text-transform: uppercase; margin-bottom: 2px; }
    .kpi-val { font-size: 14px; font-weight: 800; color: #2b6cb0; }

    /* Search Bar in Summary */
    .search-box-wrap { position: relative; margin-bottom: 10px; }
    .search-box-wrap input { padding-left: 32px; border-radius: 8px; }
    .search-icon { position: absolute; left: 10px; top: 11px; font-size: 13px; color: #a0aec0; }

    /* Tables */
    .view-box { display: none; }
    .custom-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; background: #fff; }
    .custom-table th, .custom-table td { border: 1px solid #e2e8f0; padding: 7px 9px; text-align: left; }
    .custom-table th { background: #2b6cb0; color: white; font-weight: 600; }
    
    .company-title-banner { background: #1a365d; color: #fff; padding: 9px 12px; font-size: 13.5px; font-weight: bold; border-radius: 6px; margin-top: 15px; }
    .vehicle-header-bar { background: #edf2f7; color: #2d3748; font-weight: bold; padding: 6px 10px; font-size: 12.5px; border-left: 4px solid #3182ce; margin-top: 10px; }
    .vehicle-subtotal-row { background: #f7fafc; font-weight: bold; color: #2b6cb0; }
    .company-total-banner { background: #e2e8f0; font-weight: bold; color: #1a202c; padding: 7px 10px; text-align: right; border-radius: 4px; margin-top: 4px; font-size: 12.5px; }
    
    .summary-heading { margin-top: 25px; font-size: 14px; font-weight: 800; color: #2d3748; text-transform: uppercase; border-bottom: 2px solid #4a5568; padding-bottom: 4px; }
    .company-summary-row { background: #ffff00; font-weight: bold; color: #000; }
    .vehicle-summary-row { background: #ffffff; }
    .vehicle-summary-row td:first-child { padding-left: 20px; color: #4a5568; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 92%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .btn-add-mini { background: none; border: none; color: #3182ce; font-weight: bold; cursor: pointer; font-size: 12px; }

    @media print {
      body { background: #fff; padding: 0; }
      .container { max-width: 100%; box-shadow: none; padding: 0; width: 100%; }
      .tab-header, .btn-scan, #reader-container, .btn-submit, .btn-print, .btn-add-mini, #msg, #closingDateFilters, .refresh-btn, .search-box-wrap, .kpi-grid {
        display: none !important;
      }
      .view-box { display: block !important; }
      .custom-table { width: 100%; border: 1px solid #000; font-size: 11px; }
      .custom-table th, .custom-table td { border: 1px solid #000; padding: 4px 6px; color: #000; }
      .company-title-banner { background: #ddd !important; color: #000 !important; border: 1px solid #000; -webkit-print-color-adjust: exact; }
      .company-summary-row { background: #ffff00 !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Tabs -->
  <div class="tab-header">
    <button class="tab-btn active" id="tabInBtn" type="button" onclick="switchTab('IN')">Stock In</button>
    <button class="tab-btn" id="tabOutBtn" type="button" onclick="switchTab('OUT')">Stock Out</button>
    <button class="tab-btn" id="tabSummaryBtn" type="button" onclick="switchTab('SUMMARY')">📊 Stock Summary</button>
    <button class="tab-btn" id="tabClosingBtn" type="button" onclick="switchTab('CLOSING')">🔒 Month Closing</button>
  </div>

  <!-- Camera Container -->
  <div id="reader-container">
    <div id="reader"></div>
    <button type="button" class="btn-close-scan" onclick="stopScanner()">Close Camera</button>
  </div>

  <!-- Entry Form -->
  <form id="stockForm">
    <div class="form-group">
      <label>Date & Time</label>
      <input type="text" id="dateTimeDisplay" readonly style="background:#edf2f7;">
    </div>

    <div class="form-group">
      <label>Barcode</label>
      <div class="barcode-row">
        <input type="text" id="barcodeInput" placeholder="Type barcode or scan..." autocomplete="off">
        <button type="button" class="btn-scan" onclick="startScanner('MAIN')">📷 Scan</button>
      </div>
    </div>

    <div class="form-group">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <label style="display:inline-block;">Product Name</label>
          <span id="stockInHandBadge" class="stock-badge hidden"></span>
        </div>
        <button type="button" class="btn-add-mini" onclick="openAddProductModal()">➕ Add New</button>
      </div>
      <select id="productSelect" onchange="onProductSelect(this.value)">
        <option value="">-- Select Product --</option>
      </select>
    </div>

    <div class="form-group">
      <label>HSN Code</label>
      <input type="text" id="hsnInput" placeholder="Auto filled">
    </div>

    <div class="form-group">
      <label>Quantity</label>
      <input type="number" id="qtyInput" min="1" placeholder="Quantity" required oninput="calculateTotal()">
    </div>

    <div class="form-group">
      <label>Rate (per unit)</label>
      <input type="number" id="rateInput" step="0.01" placeholder="Rate" oninput="calculateTotal()">
    </div>

    <div class="form-group">
      <label>Total Amount</label>
      <input type="number" id="totalAmountInput" readonly style="background:#edf2f7;">
    </div>

    <div class="form-group" id="partyGroup">
      <label>Supplier / Party Name</label>
      <input type="text" id="partyInput" placeholder="Supplier name">
    </div>

    <div class="form-group hidden" id="vehicleGroup">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label>Vehicle Number</label>
        <button type="button" class="btn-add-mini" onclick="openAddVehicleModal()">➕ Add New</button>
      </div>
      <select id="vehicleInput" onchange="onVehicleChange(this.value)">
        <option value="">-- Select Vehicle --</option>
      </select>
    </div>

    <div class="form-group hidden" id="companyGroup">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label>Company Name</label>
        <button type="button" class="btn-add-mini" onclick="openAddCompanyModal()">➕ Add New</button>
      </div>
      <select id="companyInput">
        <option value="">-- Select Company --</option>
        <option value="COMRAO PVT. LTD">COMRAO PVT. LTD</option>
        <option value="GOKULESHWAR RD PVT. LTD">GOKULESHWAR RD PVT. LTD</option>
      </select>
    </div>

    <div class="form-group hidden" id="driverGroup">
      <label>Driver Name</label>
      <input type="text" id="driverInput" placeholder="Driver name">
    </div>

    <div class="form-group">
      <label>Remarks</label>
      <input type="text" id="remarksInput" placeholder="Challan / Notes">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Save Entry</button>
  </form>

  <!-- Stock Summary View with Search & KPI Cards -->
  <div class="view-box" id="summaryView">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
      <h3 style="margin:0; font-size:15px; color:#1a202c;">Inventory Dashboard</h3>
      <div style="display:flex; gap:6px;">
        <button type="button" class="btn-print" onclick="window.print()" style="padding:5px 9px; font-size:11px; background:#319795; color:white; border:none; border-radius:5px; cursor:pointer;">🖨️ Print</button>
        <button type="button" class="refresh-btn" onclick="loadSummary(true)" style="padding:5px 9px; font-size:11px; background:#3182ce; color:white; border:none; border-radius:5px; cursor:pointer;">🔄 Refresh</button>
      </div>
    </div>

    <!-- 3 KPI Cards -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-title">Total Items</div>
        <div class="kpi-val" id="kpiItems">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Stock Qty</div>
        <div class="kpi-val" id="kpiStock">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Total Value</div>
        <div class="kpi-val" id="kpiValue">₹0</div>
      </div>
    </div>

    <!-- Instant Search Box -->
    <div class="search-box-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="summarySearchInput" placeholder="Search item / spare part name..." oninput="filterSummaryTable()">
    </div>

    <div id="summaryContent" style="margin-top:6px;">Loading live stock summary...</div>
  </div>

  <!-- Detailed Month Closing Report View -->
  <div class="view-box" id="closingView">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0; font-size:15px; color:#1a202c;">Monthly Vehicle Consumption Report</h3>
      <button type="button" class="btn-print" onclick="window.print()" style="padding:5px 12px; font-size:12px; background:#319795; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">🖨️ Print / Save PDF</button>
    </div>
    
    <div id="closingDateFilters" style="display:flex; gap:6px; align-items:flex-end; margin-bottom:12px;">
      <div style="flex:1;">
        <label>Start Date</label>
        <input type="date" id="closingStartDate" onchange="renderClosingReport()">
      </div>
      <div style="flex:1;">
        <label>End Date</label>
        <input type="date" id="closingEndDate" onchange="renderClosingReport()">
      </div>
      <button type="button" onclick="clearDateFilters()" style="padding:9px 12px; background:#718096; color:white; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:bold;">All</button>
    </div>

    <div id="closingContent">Loading closing data...</div>
  </div>

  <div id="msg"></div>
</div>

<!-- Password Modal -->
<div class="modal" id="authModal">
  <div class="modal-content" style="text-align:center;">
    <h3 style="margin-top:0; color:#2d3748;">🔒 Security Lock</h3>
    <p style="font-size:13px; color:#718096; margin-bottom:14px;">Month Closing dekhne ke liye password daalein:</p>
    <input type="password" id="closingPasswordInput" placeholder="Password daalein" style="text-align:center; font-size:16px; margin-bottom:14px;">
    <div style="display:flex; gap:8px;">
      <button type="button" onclick="verifyPassword()" style="flex:1; background:#3182ce; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Unlock</button>
      <button type="button" onclick="cancelPassword()" style="flex:1; background:#718096; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Cancel</button>
    </div>
    <div id="authErrMsg" style="color:#e53e3e; font-size:12px; margin-top:8px;"></div>
  </div>
</div>

<!-- Modal: Add Product -->
<div class="modal" id="addProductModal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:#2d3748;">Add New Product</h3>
    <div class="form-group">
      <label>Barcode</label>
      <input type="text" id="newProdBarcode" placeholder="Barcode">
    </div>
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="newProdName" required>
    </div>
    <div class="form-group">
      <label>HSN Code</label>
      <input type="text" id="newProdHsn">
    </div>
    <div class="form-group">
      <label>Default Rate</label>
      <input type="number" id="newProdRate">
    </div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button type="button" id="saveProdBtn" onclick="saveNewProduct()" style="flex:1; background:#38a169; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Save</button>
      <button type="button" onclick="closeAddProductModal()" style="flex:1; background:#718096; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<!-- Modal: Add Vehicle -->
<div class="modal" id="addVehicleModal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:#2d3748;">Add Vehicle</h3>
    <input type="text" id="newVehicleNo" placeholder="BR01GL0101" style="margin-bottom:14px; text-transform:uppercase;">
    <div style="display:flex; gap:8px;">
      <button type="button" id="saveVehBtn" onclick="saveNewVehicle()" style="flex:1; background:#38a169; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Save</button>
      <button type="button" onclick="closeAddVehicleModal()" style="flex:1; background:#718096; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<!-- Modal: Add Company -->
<div class="modal" id="addCompanyModal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:#2d3748;">Add Company</h3>
    <input type="text" id="newCompanyName" placeholder="Company Name" style="margin-bottom:14px;">
    <div style="display:flex; gap:8px;">
      <button type="button" onclick="saveNewCompany()" style="flex:1; background:#38a169; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Add</button>
      <button type="button" onclick="closeAddCompanyModal()" style="flex:1; background:#718096; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<!-- Safe Barcode Scanner Lib (Deferred) -->
<script src="https://unpkg.com/html5-qrcode" defer></script>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyh_kDNcWcQHLII-U1IRt-TLcY5ZtbKdE-lsAQH9u9dpclOjjy1GPHhi_OuvNO92zQo/exec";

  let currentTab = "IN";
  let productList = [];
  let vehicleList = [];
  let summaryRawData = [];
  let stockBalanceMap = new Map();

  try {
    productList = JSON.parse(localStorage.getItem("cached_products") || "[]");
    vehicleList = JSON.parse(localStorage.getItem("cached_vehicles") || "[]");
  } catch(e) {}

  let barcodeMap = new Map();
  let closingRawData = [];
  let html5QrCode = null;

  const CLOSING_PASSWORD = "425151"; 
  let isClosingUnlocked = false;

  let isSubmitting = false;
  let lastSubmissionPayload = null;
  let lastSubmissionTime = 0;

  const comraoVehicles = ["BR01GM1087", "BR01GM3679", "BR01GK0023", "BR01GN7538"];

  function buildBarcodeMap() {
    barcodeMap.clear();
    productList.forEach(p => {
      if (p.barcode) barcodeMap.set(String(p.barcode).trim().toLowerCase(), p);
    });
  }
  buildBarcodeMap();

  function populateDropdowns() {
    const sel = document.getElementById("productSelect");
    const currentProd = sel.value;
    sel.innerHTML = '<option value="">-- Select Product --</option>';
    productList.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.name;
      opt.innerText = p.name;
      sel.appendChild(opt);
    });
    if (currentProd) sel.value = currentProd;

    const vSel = document.getElementById("vehicleInput");
    const currentVeh = vSel.value;
    vSel.innerHTML = '<option value="">-- Select Vehicle --</option>';
    vehicleList.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.innerText = v;
      vSel.appendChild(opt);
    });
    if (currentVeh) vSel.value = currentVeh;
  }

  function onVehicleChange(vNo) {
    const cleanNo = (vNo || "").trim().toUpperCase();
    const compSel = document.getElementById("companyInput");
    if (!cleanNo) { compSel.value = ""; return; }
    compSel.value = comraoVehicles.includes(cleanNo) ? "COMRAO PVT. LTD" : "GOKULESHWAR RD PVT. LTD";
  }

  function updateClock() {
    const now = new Date();
    const elem = document.getElementById("dateTimeDisplay");
    if (elem) elem.value = now.toLocaleString('en-GB');
  }
  setInterval(updateClock, 1000);

  function switchTab(type) {
    if (type === "CLOSING" && !isClosingUnlocked) {
      document.getElementById("authErrMsg").innerText = "";
      document.getElementById("closingPasswordInput").value = "";
      document.getElementById("authModal").style.display = "flex";
      return;
    }

    currentTab = type;
    document.getElementById("tabInBtn").classList.toggle("active", type === "IN");
    document.getElementById("tabOutBtn").classList.toggle("active", type === "OUT");
    document.getElementById("tabSummaryBtn").classList.toggle("active", type === "SUMMARY");
    document.getElementById("tabClosingBtn").classList.toggle("active", type === "CLOSING");

    const form = document.getElementById("stockForm");
    const summaryView = document.getElementById("summaryView");
    const closingView = document.getElementById("closingView");
    const partyGroup = document.getElementById("partyGroup");
    const vehicleGroup = document.getElementById("vehicleGroup");
    const companyGroup = document.getElementById("companyGroup");
    const driverGroup = document.getElementById("driverGroup");
    const badge = document.getElementById("stockInHandBadge");
    document.getElementById("msg").innerText = "";

    if (type === "SUMMARY") {
      form.style.display = "none";
      closingView.style.display = "none";
      summaryView.style.display = "block";
      loadSummary(false);
    } else if (type === "CLOSING") {
      form.style.display = "none";
      summaryView.style.display = "none";
      closingView.style.display = "block";
      loadClosingData();
    } else {
      form.style.display = "block";
      summaryView.style.display = "none";
      closingView.style.display = "none";

      if (type === "OUT") {
        partyGroup.classList.add("hidden");
        vehicleGroup.classList.remove("hidden");
        companyGroup.classList.remove("hidden");
        driverGroup.classList.remove("hidden");
        // Ensure vehicle options exist even if offline
        if (vehicleList.length === 0) fetchMasterData();
      } else {
        partyGroup.classList.remove("hidden");
        vehicleGroup.classList.add("hidden");
        companyGroup.classList.add("hidden");
        driverGroup.classList.add("hidden");
        badge.classList.add("hidden");
      }
    }
  }

  function verifyPassword() {
    const inputPass = document.getElementById("closingPasswordInput").value;
    if (inputPass === CLOSING_PASSWORD) {
      isClosingUnlocked = true;
      document.getElementById("authModal").style.display = "none";
      switchTab("CLOSING");
    } else {
      document.getElementById("authErrMsg").innerText = "❌ Galat Password! Access Denied.";
      document.getElementById("closingPasswordInput").value = "";
    }
  }

  document.getElementById("closingPasswordInput").addEventListener("keyup", function(e) {
    if (e.key === "Enter") verifyPassword();
  });

  function cancelPassword() {
    document.getElementById("authModal").style.display = "none";
  }

  async function fetchMasterData() {
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getInitialData`);
      const data = await res.json();
      if (data.status === "success") {
        productList = data.products || [];
        vehicleList = data.vehicles || [];

        // Save both to localStorage so it never fails on mobile
        localStorage.setItem("cached_products", JSON.stringify(productList));
        localStorage.setItem("cached_vehicles", JSON.stringify(vehicleList));

        buildBarcodeMap();
        populateDropdowns();
      }
    } catch (e) {
      console.log(e);
      populateDropdowns();
    }
  }

  document.getElementById("barcodeInput").addEventListener("input", function() {
    const val = this.value.trim().toLowerCase();
    if (!val) return;
    if (barcodeMap.has(val)) {
      const p = barcodeMap.get(val);
      document.getElementById("productSelect").value = p.name;
      document.getElementById("hsnInput").value = p.hsn;
      document.getElementById("rateInput").value = p.rate;
      updateStockBadge(p.name);
      calculateTotal();
    }
  });

  function onProductSelect(val) {
    const p = productList.find(x => x.name === val);
    if (p) {
      document.getElementById("barcodeInput").value = p.barcode;
      document.getElementById("hsnInput").value = p.hsn;
      document.getElementById("rateInput").value = p.rate;
    }
    updateStockBadge(val);
    calculateTotal();
  }

  // Live Stock Badge Updater
  function updateStockBadge(prodName) {
    const badge = document.getElementById("stockInHandBadge");
    if (!prodName || currentTab !== "OUT") {
      badge.classList.add("hidden");
      return;
    }
    const bal = stockBalanceMap.has(prodName) ? stockBalanceMap.get(prodName) : null;
    if (bal !== null) {
      badge.classList.remove("hidden");
      badge.innerText = `Available: ${bal} pcs`;
      if (bal <= 2) {
        badge.className = "stock-badge stock-low";
      } else {
        badge.className = "stock-badge stock-in-hand";
      }
    } else {
      badge.classList.add("hidden");
    }
  }

  function calculateTotal() {
    const qty = parseFloat(document.getElementById("qtyInput").value) || 0;
    const rate = parseFloat(document.getElementById("rateInput").value) || 0;
    document.getElementById("totalAmountInput").value = (qty * rate).toFixed(2);
  }

  async function loadClosingData() {
    const container = document.getElementById("closingContent");
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getClosingData`);
      const resData = await res.json();
      if (resData.status === "success") {
        closingRawData = resData.data;
        renderClosingReport();
      }
    } catch (e) { container.innerHTML = "Error loading closing data."; }
  }

  function normalizeToISODate(val) {
    if (!val) return "";
    let str = String(val).trim();

    let m1 = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m1) return `${m1[1]}-${String(m1[2]).padStart(2, '0')}-${String(m1[3]).padStart(2, '0')}`;

    let m2 = str.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m2) return `${m2[3]}-${String(m2[2]).padStart(2, '0')}-${String(m2[1]).padStart(2, '0')}`;

    let parsedD = new Date(str);
    if (!isNaN(parsedD.getTime())) {
      let y = parsedD.getFullYear();
      let m = String(parsedD.getMonth() + 1).padStart(2, '0');
      let d = String(parsedD.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    return str;
  }

  function formatToDisplayDate(val) {
    if (!val) return "-";
    let str = String(val).trim();

    let m2 = str.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m2) return `${String(m2[1]).padStart(2, '0')}/${String(m2[2]).padStart(2, '0')}/${m2[3]}`;

    let m1 = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m1) return `${String(m1[3]).padStart(2, '0')}/${String(m1[2]).padStart(2, '0')}/${m1[1]}`;

    let parsedD = new Date(str);
    if (!isNaN(parsedD.getTime())) {
      let d = String(parsedD.getDate()).padStart(2, '0');
      let m = String(parsedD.getMonth() + 1).padStart(2, '0');
      let y = parsedD.getFullYear();
      return `${d}/${m}/${y}`;
    }
    return str;
  }

  function renderClosingReport() {
    const container = document.getElementById("closingContent");
    const sDate = document.getElementById("closingStartDate").value;
    const eDate = document.getElementById("closingEndDate").value;

    if (!closingRawData || closingRawData.length === 0) {
      container.innerHTML = "<p style='color:#666;'>Sheet me abhi koi Stock Out entry nahi mili.</p>";
      return;
    }

    let filtered = closingRawData.filter(r => {
      let rowDate = normalizeToISODate(r.date);
      if (sDate && rowDate < sDate) return false;
      if (eDate && rowDate > eDate) return false;
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = `
        <div style="text-align:center; padding:15px; color:#666;">
          <p>⚠️ Is date range me koi data nahi mila.</p>
          <button type="button" onclick="clearDateFilters()" style="padding:6px 14px; background:#3182ce; color:white; border:none; border-radius:4px; cursor:pointer;">Saara Data Dekhein</button>
        </div>`;
      return;
    }

    const tree = {};
    const summaryData = {};
    let grandOverallTotal = 0;

    filtered.forEach(r => {
      const comp = String(r.company || "OTHER").trim().toUpperCase();
      const veh = String(r.vehicle || "UNKNOWN").trim().toUpperCase();
      const amt = Number(r.amount) || 0;

      if (!tree[comp]) tree[comp] = {};
      if (!tree[comp][veh]) tree[comp][veh] = { items: [], totalAmount: 0 };

      tree[comp][veh].items.push(r);
      tree[comp][veh].totalAmount += amt;

      if (!summaryData[comp]) summaryData[comp] = { total: 0, vehicles: {} };
      summaryData[comp].total += amt;
      summaryData[comp].vehicles[veh] = (summaryData[comp].vehicles[veh] || 0) + amt;
      grandOverallTotal += amt;
    });

    let html = `<div>`;

    for (const comp in tree) {
      let compGrandTotal = 0;
      html += `<div class="company-title-banner">🏢 ${comp}</div>`;

      for (const veh in tree[comp]) {
        const vData = tree[comp][veh];
        compGrandTotal += vData.totalAmount;

        html += `
          <div class="vehicle-header-bar">🚛 Vehicle: ${veh}</div>
          <table class="custom-table">
            <thead>
              <tr>
                <th style="width:22%;">Date</th>
                <th>Item / Spare Part Name</th>
                <th style="width:12%; text-align:right;">Qty</th>
                <th style="width:18%; text-align:right;">Rate (₹)</th>
                <th style="width:20%; text-align:right;">Amount (₹)</th>
              </tr>
            </thead>
            <tbody>
        `;

        vData.items.forEach(it => {
          let dateToShow = formatToDisplayDate(it.displayDate || it.date);
          html += `
            <tr>
              <td>${dateToShow}</td>
              <td><b>${it.item}</b></td>
              <td style="text-align:right;">${it.qty}</td>
              <td style="text-align:right;">₹${it.rate.toLocaleString('en-IN')}</td>
              <td style="text-align:right; font-weight:600;">₹${it.amount.toLocaleString('en-IN')}</td>
            </tr>
          `;
        });

        html += `
            <tr class="vehicle-subtotal-row">
              <td colspan="4" style="text-align:right;">Vehicle ${veh} Total:</td>
              <td style="text-align:right; font-weight:bold; color:#2b6cb0;">₹${vData.totalAmount.toLocaleString('en-IN')}</td>
            </tr>
          </tbody>
        </table>
        `;
      }

      html += `
        <div class="company-total-banner">
          Total Consumption for ${comp}: <span style="color:#c53030; font-size:14px;">₹${compGrandTotal.toLocaleString('en-IN')}</span>
        </div>
      `;
    }

    html += `
      <div class="summary-heading">📌 Month Closing Summary (Company & Vehicle Wise)</div>
      <table class="custom-table" style="margin-top:10px;">
        <thead>
          <tr>
            <th>Company / Vehicle</th>
            <th style="text-align:right;">Total Amount (₹)</th>
          </tr>
        </thead>
        <tbody>
    `;

    for (const comp in summaryData) {
      html += `
        <tr class="company-summary-row">
          <td>${comp}</td>
          <td style="text-align:right;">₹${summaryData[comp].total.toLocaleString('en-IN')}</td>
        </tr>
      `;
      for (const veh in summaryData[comp].vehicles) {
        html += `
          <tr class="vehicle-summary-row">
            <td>${veh}</td>
            <td style="text-align:right;">₹${summaryData[comp].vehicles[veh].toLocaleString('en-IN')}</td>
          </tr>
        `;
      }
    }

    html += `
        <tr style="background:#2d3748; color:#fff; font-weight:bold;">
          <td>GRAND TOTAL CONSUMPTION:</td>
          <td style="text-align:right; color:#48bb78; font-size:13px;">₹${grandOverallTotal.toLocaleString('en-IN')}</td>
        </tr>
      </tbody>
    </table>
    </div>`;

    container.innerHTML = html;
  }

  function clearDateFilters() {
    document.getElementById("closingStartDate").value = "";
    document.getElementById("closingEndDate").value = "";
    renderClosingReport();
  }

  // Load & Render Live Summary with KPI & Fast Search
  async function loadSummary(isManualRefresh = false) {
    const container = document.getElementById("summaryContent");
    if (isManualRefresh) container.innerHTML = "<p style='color:#718096;'>Refreshing stock...</p>";
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getSummary`);
      const resData = await res.json();
      if (resData.status === "success") {
        summaryRawData = resData.data;

        // Map balance for live form checking
        stockBalanceMap.clear();
        summaryRawData.forEach(r => {
          stockBalanceMap.set(r.item, r.balance);
        });

        // Update KPI Cards
        let totalItems = summaryRawData.length;
        let totalUnits = summaryRawData.reduce((acc, r) => acc + (r.balance || 0), 0);
        let totalVal = summaryRawData.reduce((acc, r) => acc + (r.totalValue || 0), 0);

        document.getElementById("kpiItems").innerText = totalItems;
        document.getElementById("kpiStock").innerText = totalUnits.toLocaleString('en-IN');
        document.getElementById("kpiValue").innerText = "₹" + totalVal.toLocaleString('en-IN');

        filterSummaryTable();
      }
    } catch(e) { container.innerHTML = "Error loading summary"; }
  }

  // Search Filter in Summary
  function filterSummaryTable() {
    const query = (document.getElementById("summarySearchInput").value || "").trim().toLowerCase();
    const container = document.getElementById("summaryContent");

    let filtered = summaryRawData.filter(r => {
      if (!query) return true;
      return String(r.item).toLowerCase().includes(query);
    });

    if (filtered.length === 0) {
      container.innerHTML = "<p style='color:#718096; text-align:center; padding:10px;'>Koi spare part match nahi hua.</p>";
      return;
    }

    let grandTotal = 0;
    let html = `<table class="custom-table">
      <thead><tr><th>Item</th><th style='text-align:center;'>In</th><th style='text-align:center;'>Out</th><th style='text-align:center;'>Bal</th><th style='text-align:right;'>Value (₹)</th></tr></thead><tbody>`;
    
    filtered.forEach(r => {
      grandTotal += r.totalValue;
      let balBadge = r.balance <= 2 
        ? `<span style='color:#c53030; font-weight:bold;'>${r.balance} <span style='font-size:9px; background:#fed7d7; padding:1px 4px; border-radius:3px;'>Low</span></span>`
        : `<span style='color:#2f855a; font-weight:bold;'>${r.balance}</span>`;

      html += `<tr>
        <td><b>${r.item}</b></td>
        <td style='text-align:center;'>${r.totalIn}</td>
        <td style='text-align:center;'>${r.totalOut}</td>
        <td style='text-align:center;'>${balBadge}</td>
        <td style='text-align:right;'>₹${r.totalValue.toLocaleString('en-IN')}</td>
      </tr>`;
    });
    
    html += `<tr style="background:#edf2f7;font-weight:bold;"><td colspan="4" style="text-align:right;">Subtotal:</td><td style="color:#c53030; text-align:right;">₹${grandTotal.toLocaleString('en-IN')}</td></tr></tbody></table>`;
    container.innerHTML = html;
  }

  // Camera Handler
  function startScanner(target) {
    if (typeof Html5Qrcode === "undefined") {
      alert("Scanner module load ho raha hai, thoda intezaar karein.");
      return;
    }
    const container = document.getElementById("reader-container");
    container.style.display = "block";
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } },
      (decoded) => {
        document.getElementById("barcodeInput").value = decoded;
        document.getElementById("barcodeInput").dispatchEvent(new Event("input"));
        stopScanner();
      }, () => {}
    );
  }

  function stopScanner() {
    if (html5QrCode) {
      try { html5QrCode.stop(); } catch(e){}
    }
    document.getElementById("reader-container").style.display = "none";
  }

  function openAddProductModal() { document.getElementById("addProductModal").style.display = "flex"; }
  function closeAddProductModal() { document.getElementById("addProductModal").style.display = "none"; }
  function openAddVehicleModal() { document.getElementById("addVehicleModal").style.display = "flex"; }
  function closeAddVehicleModal() { document.getElementById("addVehicleModal").style.display = "none"; }
  function openAddCompanyModal() { document.getElementById("addCompanyModal").style.display = "flex"; }
  function closeAddCompanyModal() { document.getElementById("addCompanyModal").style.display = "none"; }

  async function saveNewProduct() {
    const btn = document.getElementById("saveProdBtn");
    btn.disabled = true;
    btn.innerText = "Saving...";

    const newProd = {
      type: "ADD_PRODUCT",
      barcode: document.getElementById("newProdBarcode").value.trim(),
      itemName: document.getElementById("newProdName").value.trim(),
      hsn: document.getElementById("newProdHsn").value.trim(),
      rate: Number(document.getElementById("newProdRate").value || 0)
    };

    productList.push(newProd);
    localStorage.setItem("cached_products", JSON.stringify(productList));
    buildBarcodeMap();
    populateDropdowns();

    closeAddProductModal();
    btn.disabled = false;
    btn.innerText = "Save";

    await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(newProd) });
    loadSummary();
  }

  async function saveNewVehicle() {
    const btn = document.getElementById("saveVehBtn");
    const vNo = document.getElementById("newVehicleNo").value.trim().toUpperCase();
    if (!vNo) return;
    btn.disabled = true;
    btn.innerText = "Saving...";

    if (!vehicleList.includes(vNo)) {
      vehicleList.push(vNo);
      localStorage.setItem("cached_vehicles", JSON.stringify(vehicleList));
      populateDropdowns();
    }

    closeAddVehicleModal();
    btn.disabled = false;
    btn.innerText = "Save";

    await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ type: "ADD_VEHICLE", vehicleNo: vNo }) });
  }

  function saveNewCompany() {
    const comp = document.getElementById("newCompanyName").value.trim().toUpperCase();
    if (!comp) return;
    const opt = document.createElement("option"); opt.value = comp; opt.innerText = comp;
    document.getElementById("companyInput").appendChild(opt);
    document.getElementById("companyInput").value = comp;
    closeAddCompanyModal();
  }

  function startCooldownTimer(seconds) {
    const btn = document.getElementById("submitBtn");
    let remaining = seconds;
    btn.disabled = true;

    const timer = setInterval(() => {
      btn.innerText = `⏳ Ready in ${remaining}s...`;
      remaining--;
      if (remaining < 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.innerText = "Save Entry";
        isSubmitting = false;
      }
    }, 1000);
  }

  // AUTO REFRESH + DUPLICATE PROTECTED SUBMIT HANDLER
  document.getElementById("stockForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (isSubmitting) return;

    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");
    const nowMs = Date.now();

    const payload = {
      type: currentTab,
      barcode: document.getElementById("barcodeInput").value,
      itemName: document.getElementById("productSelect").value,
      hsn: document.getElementById("hsnInput").value,
      qty: document.getElementById("qtyInput").value,
      rate: document.getElementById("rateInput").value,
      totalAmount: document.getElementById("totalAmountInput").value,
      partyName: document.getElementById("partyInput").value,
      companyName: document.getElementById("companyInput").value,
      vehicleNo: document.getElementById("vehicleInput").value,
      driverName: document.getElementById("driverInput").value,
      remarks: document.getElementById("remarksInput").value
    };

    if (lastSubmissionPayload && (nowMs - lastSubmissionTime) < 20000) {
      const isIdentical = (
        lastSubmissionPayload.type === payload.type &&
        lastSubmissionPayload.itemName === payload.itemName &&
        lastSubmissionPayload.qty === payload.qty &&
        lastSubmissionPayload.vehicleNo === payload.vehicleNo &&
        lastSubmissionPayload.partyName === payload.partyName
      );

      if (isIdentical) {
        const confirmSave = confirm("⚠️ Warning: Same item aur quantity abhi 20 second pehle save hui thi. Dobara save karein?");
        if (!confirmSave) {
          msg.innerText = "Entry cancelled.";
          msg.style.color = "#718096";
          return;
        }
      }
    }

    isSubmitting = true;
    btn.disabled = true;
    btn.innerText = "Saving to Sheet...";
    msg.innerText = "⏳ Saving...";
    msg.style.color = "#3182ce";

    try {
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();

      if (data.status === "success") {
        msg.innerText = "✅ " + data.message;
        msg.style.color = "#2f855a";
        lastSubmissionPayload = payload;
        lastSubmissionTime = Date.now();

        document.getElementById("stockForm").reset();
        document.getElementById("stockInHandBadge").classList.add("hidden");
        updateClock();
        document.getElementById("barcodeInput").focus();

        // Automatic Background Sync
        loadSummary();
        loadClosingData();

        startCooldownTimer(3);
      } else {
        msg.innerText = "❌ " + data.message;
        msg.style.color = "#e53e3e";
        btn.disabled = false;
        btn.innerText = "Save Entry";
        isSubmitting = false;
      }
    } catch(err) {
      msg.innerText = "❌ Request Error: " + err.message;
      msg.style.color = "#e53e3e";
      btn.disabled = false;
      btn.innerText = "Save Entry";
      isSubmitting = false;
    }
  });

  // Fast Page Load Sequence
  window.addEventListener("DOMContentLoaded", () => {
    updateClock();
    populateDropdowns();
    fetchMasterData();
    loadSummary();
  });
</script>
