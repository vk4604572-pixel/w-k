<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet & Inventory Pro</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #eef2f5; margin: 0; padding: 12px; }
    .container { max-width: 500px; margin: auto; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .config-box { background: #f8f9fa; border: 1px dashed #007bff; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    .config-box summary { font-size: 13px; font-weight: bold; color: #007bff; cursor: pointer; }
    .config-box input { margin-top: 8px; width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

    .tab-header { display: flex; margin-bottom: 14px; border-radius: 8px; overflow: hidden; border: 2px solid #007bff; }
    .tab-btn { flex: 1; padding: 9px 2px; text-align: center; border: none; background: #fff; color: #007bff; font-weight: bold; font-size: 11px; cursor: pointer; }
    .tab-btn.active { background: #007bff; color: #fff; }

    .form-group { margin-bottom: 11px; }
    label { display: block; margin-bottom: 3px; font-weight: 600; font-size: 12px; color: #333; }
    input, select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    input:focus, select:focus { outline: none; border-color: #007bff; }

    .barcode-row { display: flex; gap: 8px; }
    .btn-scan { background: #17a2b8; color: white; border: none; padding: 0 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    #reader-container { display: none; margin-bottom: 12px; border: 2px solid #17a2b8; border-radius: 8px; padding: 6px; background: #000; text-align: center; }
    #reader { width: 100%; }
    .btn-close-scan { margin-top: 6px; background: #dc3545; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    .btn-submit { width: 100%; padding: 12px; background: #28a745; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-submit:disabled { background: #94d3a2; cursor: not-allowed; }
    .hidden { display: none; }
    #msg { margin-top: 10px; text-align: center; font-weight: bold; font-size: 13px; }

    .view-box { display: none; }
    .custom-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    .custom-table th, .custom-table td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    .custom-table th { background: #007bff; color: white; }
    
    /* Screenshot Style Layout */
    .company-header-row { background: #ffff00; font-weight: bold; color: #000; font-size: 13px; }
    .vehicle-row { background: #ffffff; }
    .vehicle-row td:first-child { padding-left: 20px; color: #333; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 18px; border-radius: 10px; width: 92%; max-width: 380px; }
    .btn-add-mini { background: none; border: none; color: #007bff; font-weight: bold; cursor: pointer; font-size: 12px; }

    /* Print Styles */
    @media print {
      body { background: #fff; padding: 0; }
      .container { max-width: 100%; box-shadow: none; padding: 0; }
      .config-box, .tab-header, .btn-scan, #reader-container, .btn-submit, .btn-print, .btn-add-mini, #msg, #closingDateFilters, .refresh-btn {
        display: none !important;
      }
      .view-box { display: block !important; }
      .custom-table { width: 100%; border: 1px solid #000; }
      .custom-table th, .custom-table td { border: 1px solid #000; padding: 6px; color: #000; }
      .company-header-row { background: #ffff00 !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Settings URL -->
  <details class="config-box" id="configDropdown">
    <summary>⚙️ Apps Script Web App URL Setting</summary>
    <div>
      <input type="text" id="scriptUrlInput" placeholder="Apps Script Web App URL paste karein">
      <button type="button" onclick="saveScriptUrl()" style="margin-top: 6px; width: 100%; background: #007bff; color: white; border: none; padding: 7px; border-radius: 4px; font-weight: bold; cursor: pointer;">Save URL</button>
    </div>
  </details>

  <!-- 4 Navigation Tabs -->
  <div class="tab-header">
    <button class="tab-btn active" id="tabInBtn" onclick="switchTab('IN')">Stock In</button>
    <button class="tab-btn" id="tabOutBtn" onclick="switchTab('OUT')">Stock Out</button>
    <button class="tab-btn" id="tabSummaryBtn" onclick="switchTab('SUMMARY')">📊 Stock Summary</button>
    <button class="tab-btn" id="tabClosingBtn" onclick="switchTab('CLOSING')">🔒 Month Closing</button>
  </div>

  <!-- Camera Scanner Box -->
  <div id="reader-container">
    <div id="reader"></div>
    <button type="button" class="btn-close-scan" onclick="stopScanner()">Close Camera</button>
  </div>

  <!-- Entry Form (IN & OUT) -->
  <form id="stockForm">
    <div class="form-group">
      <label>Date & Time</label>
      <input type="text" id="dateTimeDisplay" readonly style="background:#e9ecef;">
    </div>

    <!-- Instant Barcode Input -->
    <div class="form-group">
      <label>Barcode</label>
      <div class="barcode-row">
        <input type="text" id="barcodeInput" placeholder="Type barcode or scan..." autocomplete="off">
        <button type="button" class="btn-scan" onclick="startScanner('MAIN')">📷 Scan</button>
      </div>
    </div>

    <div class="form-group">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label>Product Name</label>
        <button type="button" class="btn-add-mini" onclick="openAddProductModal()">➕ Add New</button>
      </div>
      <select id="productSelect" onchange="onProductSelect(this.value)">
        <option value="">-- Select Product --</option>
      </select>
    </div>

    <div class="form-group">
      <label>HSN Code</label>
      <input type="text" id="hsnInput" placeholder="Auto filled">
    </div>

    <div class="form-group">
      <label>Quantity</label>
      <input type="number" id="qtyInput" min="1" placeholder="Quantity" required oninput="calculateTotal()">
    </div>

    <div class="form-group">
      <label>Rate (per unit)</label>
      <input type="number" id="rateInput" step="0.01" placeholder="Rate" oninput="calculateTotal()">
    </div>

    <div class="form-group">
      <label>Total Amount</label>
      <input type="number" id="totalAmountInput" readonly style="background:#e9ecef;">
    </div>

    <div class="form-group" id="partyGroup">
      <label>Supplier / Party Name</label>
      <input type="text" id="partyInput" placeholder="Supplier name">
    </div>

    <div class="form-group hidden" id="vehicleGroup">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label>Vehicle Number</label>
        <button type="button" class="btn-add-mini" onclick="openAddVehicleModal()">➕ Add New</button>
      </div>
      <select id="vehicleInput" onchange="onVehicleChange(this.value)">
        <option value="">-- Select Vehicle --</option>
      </select>
    </div>

    <div class="form-group hidden" id="companyGroup">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label>Company Name</label>
        <button type="button" class="btn-add-mini" onclick="openAddCompanyModal()">➕ Add New</button>
      </div>
      <select id="companyInput">
        <option value="">-- Select Company --</option>
        <option value="COMRAO PVT. LTD">COMRAO PVT. LTD</option>
        <option value="GOKULESHWAR RD PVT. LTD">GOKULESHWAR RD PVT. LTD</option>
      </select>
    </div>

    <div class="form-group hidden" id="driverGroup">
      <label>Driver Name</label>
      <input type="text" id="driverInput" placeholder="Driver name">
    </div>

    <div class="form-group">
      <label>Remarks</label>
      <input type="text" id="remarksInput" placeholder="Challan / Notes">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Save Entry</button>
  </form>

  <!-- Stock Summary View -->
  <div class="view-box" id="summaryView">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; font-size:14px;">Live Stock & Total Value</h3>
      <div style="display:flex; gap:6px;">
        <button type="button" class="btn-print" onclick="window.print()" style="padding:4px 8px; font-size:11px; background:#17a2b8; color:white; border:none; border-radius:4px; cursor:pointer;">🖨️ Print</button>
        <button type="button" class="refresh-btn" onclick="loadSummary()" style="padding:4px 8px; font-size:11px; background:#007bff; color:white; border:none; border-radius:4px; cursor:pointer;">🔄 Refresh</button>
      </div>
    </div>
    <div id="summaryContent" style="margin-top:10px;">Loading stock summary...</div>
  </div>

  <!-- Month Closing Report View (Screenshot Style + Print)[cite: 1] -->
  <div class="view-box" id="closingView">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0; font-size:14px;">Month Closing Report</h3>
      <button type="button" class="btn-print" onclick="window.print()" style="padding:4px 10px; font-size:11px; background:#17a2b8; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">🖨️ Print / PDF</button>
    </div>
    
    <div id="closingDateFilters" style="display:flex; gap:8px; margin-bottom:10px;">
      <div style="flex:1;">
        <label>Start Date</label>
        <input type="date" id="closingStartDate" onchange="renderClosingReport()">
      </div>
      <div style="flex:1;">
        <label>End Date</label>
        <input type="date" id="closingEndDate" onchange="renderClosingReport()">
      </div>
    </div>
    <div id="closingContent">Loading closing data...</div>
  </div>

  <div id="msg"></div>
</div>

<!-- Modal: Password Protection -->
<div class="modal" id="authModal">
  <div class="modal-content" style="text-align:center;">
    <h3 style="margin-top:0;">🔒 Security Lock</h3>
    <p style="font-size:13px; color:#555; margin-bottom:12px;">Month Closing dekhne ke liye password daalein:</p>
    <input type="password" id="closingPasswordInput" placeholder="Password daalein" style="text-align:center; font-size:16px; margin-bottom:12px;" autofocus>
    <div style="display:flex; gap:8px;">
      <button type="button" onclick="verifyPassword()" style="flex:1; background:#007bff; color:#fff; border:none; padding:10px; border-radius:5px; font-weight:bold; cursor:pointer;">Unlock</button>
      <button type="button" onclick="cancelPassword()" style="flex:1; background:#6c757d; color:#fff; border:none; padding:10px; border-radius:5px; font-weight:bold; cursor:pointer;">Cancel</button>
    </div>
    <div id="authErrMsg" style="color:red; font-size:12px; margin-top:8px;"></div>
  </div>
</div>

<!-- Modal: Add Product -->
<div class="modal" id="addProductModal">
  <div class="modal-content">
    <h3 style="margin-top:0;">Add New Product</h3>
    <div id="modal-reader-container" style="display:none; margin-bottom:10px; border:2px solid #17a2b8; border-radius:8px; padding:6px; background:#000; text-align:center;">
      <div id="modal-reader"></div>
      <button type="button" class="btn-close-scan" onclick="stopScanner()">Close Camera</button>
    </div>
    <div class="form-group">
      <label>Barcode</label>
      <div class="barcode-row">
        <input type="text" id="newProdBarcode" placeholder="Barcode">
        <button type="button" class="btn-scan" onclick="startScanner('MODAL')">📷 Scan</button>
      </div>
    </div>
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="newProdName" required>
    </div>
    <div class="form-group">
      <label>HSN Code</label>
      <input type="text" id="newProdHsn">
    </div>
    <div class="form-group">
      <label>Default Rate</label>
      <input type="number" id="newProdRate">
    </div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button type="button" id="saveProdBtn" onclick="saveNewProduct()" style="flex:1; background:#28a745; color:#fff; border:none; padding:9px; border-radius:5px; font-weight:bold; cursor:pointer;">Save</button>
      <button type="button" onclick="closeAddProductModal()" style="flex:1; background:#6c757d; color:#fff; border:none; padding:9px; border-radius:5px; font-weight:bold; cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<!-- Modal: Add Vehicle -->
<div class="modal" id="addVehicleModal">
  <div class="modal-content">
    <h3 style="margin-top:0;">Add Vehicle</h3>
    <input type="text" id="newVehicleNo" placeholder="BR01GL0101" style="margin-bottom:12px; text-transform:uppercase;">
    <div style="display:flex; gap:8px;">
      <button type="button" id="saveVehBtn" onclick="saveNewVehicle()" style="flex:1; background:#28a745; color:#fff; border:none; padding:9px; border-radius:5px; font-weight:bold; cursor:pointer;">Save</button>
      <button type="button" onclick="closeAddVehicleModal()" style="flex:1; background:#6c757d; color:#fff; border:none; padding:9px; border-radius:5px; font-weight:bold; cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<!-- Modal: Add Company -->
<div class="modal" id="addCompanyModal">
  <div class="modal-content">
    <h3 style="margin-top:0;">Add Company</h3>
    <input type="text" id="newCompanyName" placeholder="Company Name" style="margin-bottom:12px;">
    <div style="display:flex; gap:8px;">
      <button type="button" onclick="saveNewCompany()" style="flex:1; background:#28a745; color:#fff; border:none; padding:9px; border-radius:5px; font-weight:bold; cursor:pointer;">Add</button>
      <button type="button" onclick="closeAddCompanyModal()" style="flex:1; background:#6c757d; color:#fff; border:none; padding:9px; border-radius:5px; font-weight:bold; cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<script>
  let SCRIPT_URL = localStorage.getItem("sheet_script_url") || "";
  let currentTab = "IN";
  let productList = JSON.parse(localStorage.getItem("cached_products") || "[]");
  let barcodeMap = new Map();
  let closingRawData = [];
  let html5QrCode = null;
  let activeScanTarget = "MAIN";

  // Password Lock Settings
  const CLOSING_PASSWORD = "425151"; // Yahan password change kar sakte hain
  let isClosingUnlocked = false;

  const comraoVehicles = ["BR01GM1087", "BR01GM3679", "BR01GK0023", "BR01GN7538"];

  function buildBarcodeMap() {
    barcodeMap.clear();
    productList.forEach(p => {
      if (p.barcode) barcodeMap.set(String(p.barcode).trim().toLowerCase(), p);
    });
  }
  buildBarcodeMap();

  function onVehicleChange(vNo) {
    const cleanNo = vNo.trim().toUpperCase();
    const compSel = document.getElementById("companyInput");
    if (!cleanNo) { compSel.value = ""; return; }
    compSel.value = comraoVehicles.includes(cleanNo) ? "COMRAO PVT. LTD" : "GOKULESHWAR RD PVT. LTD";
  }

  function saveScriptUrl() {
    const val = document.getElementById("scriptUrlInput").value.trim();
    if (!val) return;
    localStorage.setItem("sheet_script_url", val);
    SCRIPT_URL = val;
    alert("Script URL Saved!");
    document.getElementById("configDropdown").removeAttribute("open");
    fetchMasterData();
  }

  if (SCRIPT_URL) {
    document.getElementById("scriptUrlInput").value = SCRIPT_URL;
  } else {
    document.getElementById("configDropdown").setAttribute("open", true);
  }

  function updateClock() {
    const now = new Date();
    document.getElementById("dateTimeDisplay").value = now.toLocaleString('en-GB');
  }
  setInterval(updateClock, 1000);
  updateClock();

  function switchTab(type) {
    // Password protection check for Month Closing
    if (type === "CLOSING" && !isClosingUnlocked) {
      document.getElementById("authErrMsg").innerText = "";
      document.getElementById("closingPasswordInput").value = "";
      document.getElementById("authModal").style.display = "flex";
      return;
    }

    currentTab = type;
    document.getElementById("tabInBtn").classList.toggle("active", type === "IN");
    document.getElementById("tabOutBtn").classList.toggle("active", type === "OUT");
    document.getElementById("tabSummaryBtn").classList.toggle("active", type === "SUMMARY");
    document.getElementById("tabClosingBtn").classList.toggle("active", type === "CLOSING");

    const form = document.getElementById("stockForm");
    const summaryView = document.getElementById("summaryView");
    const closingView = document.getElementById("closingView");
    const partyGroup = document.getElementById("partyGroup");
    const vehicleGroup = document.getElementById("vehicleGroup");
    const companyGroup = document.getElementById("companyGroup");
    const driverGroup = document.getElementById("driverGroup");
    document.getElementById("msg").innerText = "";

    if (type === "SUMMARY") {
      form.style.display = "none";
      closingView.style.display = "none";
      summaryView.style.display = "block";
      loadSummary();
    } else if (type === "CLOSING") {
      form.style.display = "none";
      summaryView.style.display = "none";
      closingView.style.display = "block";
      loadClosingData();
    } else {
      form.style.display = "block";
      summaryView.style.display = "none";
      closingView.style.display = "none";

      if (type === "OUT") {
        partyGroup.classList.add("hidden");
        vehicleGroup.classList.remove("hidden");
        companyGroup.classList.remove("hidden");
        driverGroup.classList.remove("hidden");
      } else {
        partyGroup.classList.remove("hidden");
        vehicleGroup.classList.add("hidden");
        companyGroup.classList.add("hidden");
        driverGroup.classList.add("hidden");
      }
    }
  }

  function verifyPassword() {
    const inputPass = document.getElementById("closingPasswordInput").value;
    if (inputPass === CLOSING_PASSWORD) {
      isClosingUnlocked = true;
      document.getElementById("authModal").style.display = "none";
      switchTab("CLOSING");
    } else {
      document.getElementById("authErrMsg").innerText = "❌ Galat Password! Access Denied.";
      document.getElementById("closingPasswordInput").value = "";
    }
  }

  document.getElementById("closingPasswordInput").addEventListener("keyup", function(e) {
    if (e.key === "Enter") verifyPassword();
  });

  function cancelPassword() {
    document.getElementById("authModal").style.display = "none";
  }

  // Fast One-time Master Data Fetch
  async function fetchMasterData() {
    if (!SCRIPT_URL) return;
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getInitialData`);
      const data = await res.json();
      if (data.status === "success") {
        productList = data.products;
        localStorage.setItem("cached_products", JSON.stringify(productList));
        buildBarcodeMap();

        const sel = document.getElementById("productSelect");
        sel.innerHTML = '<option value="">-- Select Product --</option>';
        productList.forEach(p => {
          const opt = document.createElement("option");
          opt.value = p.name;
          opt.innerText = p.name;
          sel.appendChild(opt);
        });

        const vSel = document.getElementById("vehicleInput");
        vSel.innerHTML = '<option value="">-- Select Vehicle --</option>';
        data.vehicles.forEach(v => {
          const opt = document.createElement("option");
          opt.value = v;
          opt.innerText = v;
          vSel.appendChild(opt);
        });
      }
    } catch (e) { console.log(e); }
  }

  // Instant Manual Barcode Typing Match
  document.getElementById("barcodeInput").addEventListener("input", function() {
    const val = this.value.trim().toLowerCase();
    if (!val) return;
    if (barcodeMap.has(val)) {
      const p = barcodeMap.get(val);
      document.getElementById("productSelect").value = p.name;
      document.getElementById("hsnInput").value = p.hsn;
      document.getElementById("rateInput").value = p.rate;
      calculateTotal();
    }
  });

  function onProductSelect(val) {
    const p = productList.find(x => x.name === val);
    if (p) {
      document.getElementById("barcodeInput").value = p.barcode;
      document.getElementById("hsnInput").value = p.hsn;
      document.getElementById("rateInput").value = p.rate;
      calculateTotal();
    }
  }

  function calculateTotal() {
    const qty = parseFloat(document.getElementById("qtyInput").value) || 0;
    const rate = parseFloat(document.getElementById("rateInput").value) || 0;
    document.getElementById("totalAmountInput").value = (qty * rate).toFixed(2);
  }

  // Month Closing Load & Render (Exact Screenshot Layout + Date Range)[cite: 1]
  async function loadClosingData() {
    const container = document.getElementById("closingContent");
    if (!SCRIPT_URL) { container.innerHTML = "Save URL first!"; return; }
    container.innerHTML = "Fetching closing records...";
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getClosingData`);
      const resData = await res.json();
      if (resData.status === "success") {
        closingRawData = resData.data;
        renderClosingReport();
      }
    } catch (e) { container.innerHTML = "Error loading closing data."; }
  }

  function renderClosingReport() {
    const container = document.getElementById("closingContent");
    const sDate = document.getElementById("closingStartDate").value;
    const eDate = document.getElementById("closingEndDate").value;

    let filtered = closingRawData.filter(r => {
      if (!r.date) return false;
      let rowDate = r.date;
      if (rowDate.includes("/")) {
        let p = rowDate.split(" ")[0].split("/");
        if (p.length === 3 && p[2].length === 4) {
          rowDate = `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`;
        }
      }
      if (sDate && rowDate < sDate) return false;
      if (eDate && rowDate > eDate) return false;
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = "<p style='color: #666; font-size: 13px;'>Selected date range mein data nahi mila.</p>";
      return;
    }

    const groups = {};
    filtered.forEach(r => {
      const comp = r.company || "OTHER";
      const veh = r.vehicle || "UNKNOWN";
      if (!groups[comp]) groups[comp] = { total: 0, vehicles: {} };
      groups[comp].total += r.amount;
      groups[comp].vehicles[veh] = (groups[comp].vehicles[veh] || 0) + r.amount;
    });

    let html = `<table class="custom-table">
      <thead><tr><th>Company / Vehicle</th><th>Total Amount (₹)</th></tr></thead>
      <tbody>`;

    for (const comp in groups) {
      html += `
        <tr class="company-header-row">
          <td>${comp}</td>
          <td>₹${groups[comp].total.toLocaleString('en-IN')}</td>
        </tr>`;
      for (const veh in groups[comp].vehicles) {
        html += `
          <tr class="vehicle-row">
            <td>${veh}</td>
            <td>₹${groups[comp].vehicles[veh].toLocaleString('en-IN')}</td>
          </tr>`;
      }
    }
    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  // Stock Summary Table
  async function loadSummary() {
    const container = document.getElementById("summaryContent");
    if (!SCRIPT_URL) return;
    container.innerHTML = "Loading...";
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getSummary`);
      const resData = await res.json();
      if (resData.status === "success") {
        let grandTotal = 0;
        let html = `<table class="custom-table">
          <thead><tr><th>Item</th><th>In</th><th>Out</th><th>Bal</th><th>Value (₹)</th></tr></thead><tbody>`;
        resData.data.forEach(r => {
          grandTotal += r.totalValue;
          html += `<tr><td><b>${r.item}</b></td><td>${r.totalIn}</td><td>${r.totalOut}</td><td style="color:green;font-weight:bold;">${r.balance}</td><td>₹${r.totalValue.toLocaleString('en-IN')}</td></tr>`;
        });
        html += `<tr style="background:#eef2f5;font-weight:bold;"><td colspan="4" style="text-align:right;">Grand Total:</td><td style="color:#d9534f;">₹${grandTotal.toLocaleString('en-IN')}</td></tr></tbody></table>`;
        container.innerHTML = html;
      }
    } catch(e) { container.innerHTML = "Error loading summary"; }
  }

  if (SCRIPT_URL) fetchMasterData();

  // Scanner
  function startScanner(target) {
    activeScanTarget = target;
    const elemId = (target === "MODAL") ? "modal-reader" : "reader";
    const containerId = (target === "MODAL") ? "modal-reader-container" : "reader-container";
    const container = document.getElementById(containerId);
    container.style.display = "block";
    html5QrCode = new Html5Qrcode(elemId);
    html5QrCode.start(
      { facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } },
      (decoded) => {
        if (activeScanTarget === "MODAL") {
          document.getElementById("newProdBarcode").value = decoded;
        } else {
          document.getElementById("barcodeInput").value = decoded;
          document.getElementById("barcodeInput").dispatchEvent(new Event("input"));
        }
        stopScanner();
      }, () => {}
    );
  }

  function stopScanner() {
    if (html5QrCode) html5QrCode.stop();
    document.getElementById("reader-container").style.display = "none";
    document.getElementById("modal-reader-container").style.display = "none";
  }

  function openAddProductModal() { document.getElementById("addProductModal").style.display = "flex"; }
  function closeAddProductModal() { stopScanner(); document.getElementById("addProductModal").style.display = "none"; }
  function openAddVehicleModal() { document.getElementById("addVehicleModal").style.display = "flex"; }
  function closeAddVehicleModal() { document.getElementById("addVehicleModal").style.display = "none"; }
  function openAddCompanyModal() { document.getElementById("addCompanyModal").style.display = "flex"; }
  function closeAddCompanyModal() { document.getElementById("addCompanyModal").style.display = "none"; }

  // Fast Add Product (Optimistic UI)
  async function saveNewProduct() {
    const btn = document.getElementById("saveProdBtn");
    btn.disabled = true;
    btn.innerText = "Saving...";

    const newProd = {
      type: "ADD_PRODUCT",
      barcode: document.getElementById("newProdBarcode").value.trim(),
      itemName: document.getElementById("newProdName").value.trim(),
      hsn: document.getElementById("newProdHsn").value.trim(),
      rate: Number(document.getElementById("newProdRate").value || 0)
    };

    productList.push(newProd);
    buildBarcodeMap();
    const sel = document.getElementById("productSelect");
    const opt = document.createElement("option");
    opt.value = newProd.itemName;
    opt.innerText = newProd.itemName;
    sel.appendChild(opt);

    closeAddProductModal();
    btn.disabled = false;
    btn.innerText = "Save";

    await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(newProd) });
  }

  // Fast Add Vehicle
  async function saveNewVehicle() {
    const btn = document.getElementById("saveVehBtn");
    const vNo = document.getElementById("newVehicleNo").value.trim().toUpperCase();
    if (!vNo) return;
    btn.disabled = true;
    btn.innerText = "Saving...";

    const vSel = document.getElementById("vehicleInput");
    const opt = document.createElement("option");
    opt.value = vNo;
    opt.innerText = vNo;
    vSel.appendChild(opt);

    closeAddVehicleModal();
    btn.disabled = false;
    btn.innerText = "Save";

    await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ type: "ADD_VEHICLE", vehicleNo: vNo }) });
  }

  function saveNewCompany() {
    const comp = document.getElementById("newCompanyName").value.trim().toUpperCase();
    if (!comp) return;
    const opt = document.createElement("option"); opt.value = comp; opt.innerText = comp;
    document.getElementById("companyInput").appendChild(opt);
    document.getElementById("companyInput").value = comp;
    closeAddCompanyModal();
  }

  // Ultra-fast Submit
  document.getElementById("stockForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");
    btn.disabled = true;
    btn.innerText = "Saving...";
    msg.innerText = "";

    const payload = {
      type: currentTab,
      barcode: document.getElementById("barcodeInput").value,
      itemName: document.getElementById("productSelect").value,
      hsn: document.getElementById("hsnInput").value,
      qty: document.getElementById("qtyInput").value,
      rate: document.getElementById("rateInput").value,
      totalAmount: document.getElementById("totalAmountInput").value,
      partyName: document.getElementById("partyInput").value,
      companyName: document.getElementById("companyInput").value,
      vehicleNo: document.getElementById("vehicleInput").value,
      driverName: document.getElementById("driverInput").value,
      remarks: document.getElementById("remarksInput").value
    };

    try {
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();
      msg.innerText = "✅ " + data.message;
      msg.style.color = "green";
      document.getElementById("stockForm").reset();
      updateClock();
    } catch(err) {
      msg.innerText = "❌ Error: " + err.message;
      msg.style.color = "red";
    } finally {
      btn.disabled = false;
      btn.innerText = "Save Entry";
    }
  });
</script>
</body>
</html>
